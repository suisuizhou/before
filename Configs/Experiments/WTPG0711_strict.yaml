version: 1
protocol:
  dataset: WTPGStrict
  data_path: Dataset/WTPG_STRICT_CACHE_V1
  split: motor_speed
  domain_map: {0: 20Hz, 1: 25Hz, 2: 30Hz, 3: 35Hz, 4: 40Hz, 5: 45Hz, 6: 50Hz, 7: 55Hz}
  model: ResNet18_1D_SDE
  source_seed: 2025
  stream_seed: 2025
  passes: 1
  pre_update_scoring: true
  batch_size: 128
  num_workers: 4
source_only_screening:
  initial_source: 0
  initial_targets: [3, 4, 5, 6, 7]
  adjustment_sources: [0, 1]
  preferred_interval: [65.0, 75.0]
  target_accuracy: 70.0
  selection_rule: closest_to_70_within_interval_else_global_closest
frozen_task:
  task: [1, 3]
  source_speed_hz: 25
  target_speed_hz: 35
  ordinary_source_only_accuracy: 73.1000006198883
routes:
  source_ordinary: main_src_dtcc_wtpg_strict.py
  source_robust: main_src_0711_wtpg_strict.py
  dtcc_ordinary: main_tta_dtcc_wtpg_strict.py
  0711_robust: main_tta_0711_wtpg_strict.py
  0711_common: main_tta_0711_wtpg_strict.py
checkpoints:
  root: TTA_Model_WTPG_STRICT_V1
fixed_0711:
  Opt.lr_tar: 0.015
  TTA0711.adapter_lr_scale: 1.0
  TTA0711.warp_lr_scale: 0.1
  TTA0711.ema_beta: 0.995
  TTA0711.warmup_batches: 5
  TTA0711.aux_ramp_batches: 20
  TTA0711.min_reliability: 0.2
  TTA0711.lambda_mt: 0.02
  TTA0711.lambda_pcl: 0.02
  TTA0711.lambda_ncl: 0.01
  TTA0711.memory_per_class: 64
  TTA0711.pcl_temperature: 0.2
  TTA0711.ncl_temperature: 0.2
  TTA0711.max_mask_ratio: 0.18
  TTA0711.saliency_bands: 8
  TTA0711.saliency_half_width: 3
final_0711_wtpg:
  source_checkpoint_root: TTA_Model_WTPG_STRICT_V2
  robust_profile: wtpg_speed_noise_v1
  source_perturbation:
    response_prob: 0.8
    response_strength: 0.10
    response_knots: 8
    noise_std: 0.02
    scale_prob: 0.8
    scale_interval: [0.88, 1.12]
    local_warp_max: 1.0
    local_warp_knots: 16
  Opt.lr_tar: 0.12
  TTA0711.adapter_lr_scale: 8.0
  TTA0711.warp_lr_scale: 1.0
  TTA0711.ema_beta: 0.98
  TTA0711.warmup_batches: 5
  TTA0711.aux_ramp_batches: 5
  TTA0711.min_reliability: 0.12
  TTA0711.lambda_mt: 0.02
  TTA0711.lambda_pcl: 0.02
  TTA0711.lambda_ncl: 0.01
  TTA0711.memory_per_class: 64
  TTA0711.pcl_temperature: 0.10
  TTA0711.ncl_temperature: 0.10
  selection_status: frozen_after_development_tasks_1_to_3_5_7
