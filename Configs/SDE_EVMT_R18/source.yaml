dataset:
  name: PU4D
  cache_root: Dataset/PU4D_CACHE
  input_kind: fft

model:
  input_len: 512
  bottleneck_dim: 256
  feature_hidden_dim: 64
  gn_groups: 8
  warp_knots: 16
  max_warp: 2.0
  spectral_bands: 64
  adapter_delta: 0.1

training:
  epochs: 80
  batch_size: 64
  eval_batch_size: 512
  optimizer: AdamW
  lr: 0.001
  weight_decay: 0.00001
  num_workers: 2
  label_smoothing: 0.1
  mixup_alpha: 0.2
  mixup_prob: 0.5

augmentation:
  style_prob: 0.5
  style_strength_min: 0.05
  style_strength_max: 0.20
  style_knots: 16
  warp_prob: 0.5
  warp_knots: 16
  warp_max_min: 0.3
  warp_max_max: 2.0
  noise_prob: 0.5
  gaussian_snr_min: 25
  gaussian_snr_max: 40
  uniform_scale_min: 0.02
  uniform_scale_max: 0.08
  impulse_prob_min: 0.01
  impulse_prob_max: 0.05

loss:
  lambda_style: 0.5
  lambda_warp: 0.5
  lambda_noise: 0.5
  lambda_pred_cons: 0.2
  lambda_feat_cons: 0.05

seed: 1
device: cuda
num_classes: 32
output_root: TTA_Model/SDE_EVMT_R18/PU4D
process_wandb: false

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
